services:
  - type: web
    name: trustlink-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustlink-db
          property: connectionString
      - key: PORT
        value: 8080
    healthCheckPath: /api/healthz
    autoDeploy: true

  - type: web
    name: trustlink-web
    env: static
    plan: free
    buildCommand: pnpm --filter @workspace/trustlink run build
    staticPublishPath: artifacts/trustlink/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: trustlink-db
    plan: free
    databaseName: trustlink
    user: trustlink
