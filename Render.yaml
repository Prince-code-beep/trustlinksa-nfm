services:
    - type: web
    name: trustlink-api
    runtime: node
    plan: starter
    branch: main
    buildCommand: npx pnpm@10.12.1 install --no-frozen-lockfile --config.trust-policy=false && npx pnpm@10.12.1 --filter @workspace/api-server run build
    startCommand: npx pnpm@10.12.1 --filter @workspace/api-server run start
    envVars:
            - key: NODE_VERSION
        value: 20.19.0
            - key: NODE_ENV
        value: production
            - key: DATABASE_URL
        fromDatabase:
          name: trustlink-db
          property: connectionString

    - type: web
    name: trustlink-frontend
    runtime: node
    plan: starter
    branch: main
    buildCommand: npx pnpm@10.12.1 install --no-frozen-lockfile --config.trust-policy=false && npx pnpm@10.12.1 --filter @workspace/web run build
    startCommand: npx pnpm@10.12.1 --filter @workspace/web run start
    envVars:
            - key: NODE_VERSION
        value: 20.19.0
            - key: VITE_API_URL
        fromService:
          name: trustlink-api
          type: web
          property: host

databases:
    - name: trustlink-db
    plan: free
