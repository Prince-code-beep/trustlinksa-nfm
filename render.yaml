services:
    - type: web
    name: trustlink-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npx pnpm@10.12.1 install --no-frozen-lockfile --config.trust-policy=false && npx pnpm@10.12.1 -r --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
            - key: NODE_ENV
        value: production
            - key: PORT
        value: 10000
            - key: DATABASE_URL
        sync: false
            - key: NODE_VERSION
        value: 20.19.0
