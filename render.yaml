services:
    - type: web
    name: trustlinksa-nfm
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm run build && pnpm -r --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
            - key: NODE_ENV
        value: production
            - key: PORT
        value: 10000
            - key: NODE_VERSION
        value: 22
