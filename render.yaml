services:
    - type: web
    name: trustlink-api
    env: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
            - key: NODE_ENV
        value: production
            - key: DATABASE_URL
        fromDatabase:
          name: trustlink-db
          property: connectionString
            - key: PORT
        value: 8080
    healthCheckPath: /api/healthz

databases:
    - name: trustlink-db
    plan: free
    databaseName: trustlink
    user: trustlink

# Frontend will be deployed separately as Static Site
# After API deploys, go to Render Dashboard > New + > Static Site
# Connect same repo, Build: npm i -g pnpm && pnpm --filter @workspace/trustlink run build
# Publish: artifacts/trustlink/dist/public
